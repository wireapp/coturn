apiVersion: v2
name: coturn
description: coturn - a STUN and TURN server
type: application
version: 0.0.0
appVersion: 0.0.0
kubeVersion: ">=1.21.0-0"
annotations:
  helm.sh/images: |
    - name: coturn
      image: quay.io/wire/coturn:do-not-use
    - name: get-external-ip
      image: docker.io/alpine/kubectl:1.35.1
    - name: coturn-cert-reloader
      image: quay.io/wire/config-reloader-sidecar:72c3c8434660bd157d42012b0bcd67f338fc5c7a
    - name: pin-federation-sport
      image: registry.k8s.io/build-image/debian-iptables:bookworm-v1.0.0
