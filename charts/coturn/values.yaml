# The amount of coturn instances to run.  NOTE: Only one coturn can run per node due
# to `hostNetwork`. If this number is higher than the amount of nodes that can
# be used for scheduling (Also see `nodeSelector`) pods will remain in a
# pending state untill you add more capacity.
replicaCount: 1

image:
  repository: quay.io/wire/coturn
  pullPolicy: IfNotPresent
  # overwrite the tag here, otherwise `appVersion` of the chart will be used
  tag: ""

externalIpHelper:
  # Configures the init container that discovers the node's external IP (via the
  # node's ExternalIP address, or it's `wire.com/external-ip` annotation) and
  # writes it to a shared volume for use as __COTURN_EXT_IP__.
  #
  # The helper is enabled automatically: it runs only when __COTURN_EXT_IP__ is
  # actually referenced by the rendered config, i.e. when listening-ip/relay-ip
  # (or, with federation enabled, federation-listening-ip) fall back to their
  # default because the matching override is unset, or when coturnTurnExternalIP
  # embeds the placeholder (including the PUBLIC/PRIVATE form
  # __COTURN_EXT_IP__/__COTURN_HOST_IP__). When clients reach coturn directly at
  # the node's own interface IP, bind using __COTURN_HOST_IP__ via
  # coturnTurnListenIP / coturnTurnRelayIP and the helper (and its node-read
  # RBAC and blocking startup probe) drops out on its own.
  #
  # The image used for the initContainer that determines the external IP address of the node.
  # This is a very small image that just contains kubectl, and is only used during startup.
  # We chose the `compat` flavor of the image since we need a shell to run the command that determines the external IP address, and the `compat` image includes a shell.
  image:
    repository: docker.io/alpine/kubectl
    pullPolicy: IfNotPresent
    tag: 1.35.1

# If you have multiple deployments of coturn running in one cluster, it is
# important that they run on disjoint sets of nodes, you can use nodeSelector to enforce this
nodeSelector: {}

resources:
  requests:
    cpu: 500m
    memory: 256Mi

initResources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  fsGroup: 31338

securityContext:
  # Pick a high number that is unlikely to conflict with the host
  # https://kubesec.io/basics/containers-securitycontext-runasuser/
  runAsUser: 31338

coturnTurnListenPort: 3478
coturnMetricsListenPort: 9641
coturnTurnTlsListenPort: 5349

# IP address configuration for coturn's listeners and advertised addresses.
#
# Each of the settings below accepts either a literal IP, or one of three
# placeholder tokens that are resolved at pod startup:
#
#   __COTURN_HOST_IP__  the node's IP from the downward API (status.hostIP).
#                       With hostNetwork this is the node's primary interface
#                       IP. Always available, no RBAC, no discovery step.
#   __COTURN_POD_IP__   the pod IP from the downward API (status.podIP). With
#                       hostNetwork this equals __COTURN_HOST_IP__.
#   __COTURN_EXT_IP__   the node's *external* IP discovered by the
#                       externalIpHelper init container (cloud ExternalIP or the
#                       `wire.com/external-ip` annotation on-prem). This is the
#                       client-reachable address whenever it differs from the
#                       primary interface IP (status.hostIP). It requires the
#                       helper (node-read RBAC + a blocking startup probe). See
#                       externalIpHelper above.
#
# The external address can differ from __COTURN_HOST_IP__ for two distinct
# reasons, and they call for different settings:
#
#   (a) 1:1 NAT / mapped public IP (typical cloud EIP): the external address is
#       NOT configured on any node interface. coturn must bind to the private
#       interface (__COTURN_HOST_IP__) and only *advertise* the public address
#       via external-ip. Binding listening-ip to it would fail.
#   (b) Multi-homed node with the public IP on a second interface: the external
#       address is a real, locally-configured address, just not the primary one
#       status.hostIP reports. There is no NAT: bind listening-ip/relay-ip
#       directly to __COTURN_EXT_IP__, and external-ip is unnecessary. Here the
#       helper is selecting among the node's own interfaces, not bridging NAT,
#       which is why the downward API's single hostIP cannot supply it.
#
# Rule of thumb: if clients reach coturn at the node's primary interface IP, use
# __COTURN_HOST_IP__ everywhere and leave the helper off. Use __COTURN_EXT_IP__
# when the client-reachable address is not that primary interface IP, whether
# because it lives on another interface (b, bind to it) or behind NAT (a,
# advertise it).

# listening-ip: the address coturn binds its STUN/TURN sockets to. It must be an
# address actually present on a node interface. In the multi-homed case (b) that
# is the public interface, so set it to __COTURN_EXT_IP__. Behind NAT (a) the
# public address is not on any interface, so bind to __COTURN_HOST_IP__ instead
# and advertise via external-ip. Unset defaults to __COTURN_EXT_IP__.
# coturnTurnListenIP: "1.2.3.4" # or __COTURN_EXT_IP__ / __COTURN_POD_IP__ / __COTURN_HOST_IP__

# relay-ip: the address coturn allocates relay sockets on. Same constraint as
# listening-ip (must exist on a node interface). Usually the same as
# listening-ip. Unset defaults to __COTURN_EXT_IP__.
# coturnTurnRelayIP:

# external-ip: the address coturn *advertises* to clients (XOR-RELAYED-ADDRESS /
# reflexive address), as opposed to the one it binds to. Only needed in the NAT
# case (a), where the advertised (public) address differs from the bound
# (private) one: set it to the public IP (or __COTURN_EXT_IP__) while
# listening-ip/relay-ip stay on __COTURN_HOST_IP__. Not needed when coturn binds
# directly to the client-reachable address, i.e. direct-reachable nodes or the
# multi-homed case (b), where it would just duplicate listening-ip; leave it
# null there. Setting __COTURN_EXT_IP__ advertises the helper-discovered IP;
# a literal IP is advertised verbatim; null emits no external-ip directive.
#
# Two forms:
#   external-ip=PUBLIC          maps PUBLIC onto every relay address. Only valid
#                               with a single relay address and no RFC5780.
#   external-ip=PUBLIC/PRIVATE  explicit mapping: the socket bound to the local
#                               address PRIVATE is advertised as PUBLIC. Required
#                               once more than one address is in play, which is
#                               the case with federation enabled (it adds
#                               federation-listening-ip as a second address). The
#                               common federation value is
#                               __COTURN_EXT_IP__/__COTURN_HOST_IP__: bind to the
#                               node's host IP, advertise the discovered public
#                               IP.
coturnTurnExternalIP: null

# coturnPrometheusIP:

# federation-listening-ip: the address coturn's federation (server-to-server)
# listener binds to, on federate.port. Same interface constraint and placeholder
# meaning as listening-ip. Only rendered when federate.enabled. Unset inherits
# the effective coturnTurnListenIP (which itself defaults to __COTURN_EXT_IP__),
# so a host-bound TURN listener also host-binds federation. Set this explicitly
# (e.g. to __COTURN_EXT_IP__) only when federation needs a different interface
# than the main listener.
# coturnFederationListeningIP:

tls:
  enabled: false
  # compliant with BSI TR-02102-2
  ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384"
  secretRef:
  reloaderImage:
    # container image containing https://github.com/Pluies/config-reloader-sidecar
    # for handling runtime certificate reloads.
    repository: quay.io/wire/config-reloader-sidecar
    pullPolicy: IfNotPresent
    tag: 72c3c8434660bd157d42012b0bcd67f338fc5c7a

# CA certificate bundle configuration
# Controls certificate authority validation for coturn
ca:
  # When disabled: Uses system CA bundle at /etc/ssl/certs/ca-certificates.crt (default behavior)
  # When enabled with secretRef OR cert: Uses custom CA bundle
  # When enabled without secretRef or cert: Disables CA validation entirely (not recommended for production)
  enabled: false

  # Option 1: Reference to an existing Kubernetes Secret containing the CA bundle
  # The secret must contain a key (default: ca-certificates.crt) with the CA bundle in PEM format
  #
  # Example: Create a secret with your CA bundle:
  #   kubectl create secret generic my-ca-bundle --from-file=ca-certificates.crt=/path/to/bundle.pem
  #
  # Then reference it here:
  #   secretRef: my-ca-bundle
  #   secretKey: ca-certificates.crt
  secretRef:

  # The key within the secret that contains the CA bundle (default: ca-certificates.crt)
  # Only used when secretRef is set
  secretKey: ca-certificates.crt

  # Option 2: Inline CA certificate bundle (PEM format)
  # Mutually exclusive with secretRef - use one or the other, not both
  #
  # Example:
  #   cert: |
  #     -----BEGIN CERTIFICATE-----
  #     MIIDXTCCAkWgAwIBAgIJAKJ...
  #     -----END CERTIFICATE-----
  cert:

config:
  verboseLogging: false

federate:
  enabled: false
  port: 9191

  snat:
    # Preserve the federation source port through node-level SNAT. This requires
    # a privileged init container and should only be enabled where needed.
    enabled: false
    # Must ship iptables-nft and conntrack (no runtime install, works air-gapped).
    image:
      repository: registry.k8s.io/build-image/debian-iptables
      pullPolicy: IfNotPresent
      tag: bookworm-v1.0.0

  dtls:
    enabled: false

    tls:
    #   Example:
    #
    #   tls:
    #     key: "-----BEGIN EC PRIVATE KEY----- ..." # (ascii blob) private key
    #     crt: "-----BEGIN CERTIFICATE----- ..." # (ascii blob) certificate
    #     privateKeyPassword: "XXX" # optional, used when the key is password protected
    #
    #   OR (mutually exclusive)
    #
    #   tls:
    #      issuerRef:
    #        name: letsencrypt-http01
    #
    #        # We can reference ClusterIssuers by changing the kind here.
    #        # The default value is Issuer (i.e. a locally namespaced Issuer)
    #        # kind: Issuer
    #        kind: Issuer
    #
    #        # This is optional since cert-manager will default to this value however
    #        # if you are using an external issuer, change this to that issuer group.
    #        group: cert-manager.io
    #
    #      # optional Certificate fields. duration / renewBefore / usages
    #      # are passed through verbatim to the cert-manager Certificate.
    #      # Required when issuing from an AWS Private CA in SHORT_LIVED
    #      # mode (which caps validity at 168h and rejects the cert-manager
    #      # default of 2160h).
    #      certificate:
    #        labels: ..
    #        duration: 168h
    #        renewBefore: 144h
    #        usages:
    #          - server auth
    #          - client auth

    # # list of host/ip/cert common names / subject alt names, and optional issuer
    # # names to accept DTLS connections from. There can be multiple entries.
    # remoteWhitelist:
    #   - host: wire.example
    #     issuer: Issuer Common Name
    #   - host: another.wire.example
    #     issuer: "DigiCert SHA2 Extended Validation Server CA"
    #   - host: another-host-without-issuer.wire.example
    remoteWhitelist: []

ratelimit:
  override: false
  # # Set the maximum number of 401 Unauthorized responses allowed per rate-limiting window. Defaults is 1000.
  # requestLimit: 1000
  # # Set the time window duration in seconds for rate limiting 401 Unauthorized responses. Defaults is 120.
  # window: 120
  # # Define the IPs allowed to bypass the 401 rate-limiting
  # allowlist:
  #   - "192.168.1.1"
  #   - "192.168.1.2"

metrics:
  serviceMonitor:
    enabled: false
    # Optional: set fallback scrape protocol for prometheus-operator targets
    # that don't send a Content-Type header. Requires Prometheus >= 3.0.0.
    # Example: PrometheusText0.0.4
    fallbackScrapeProtocol: ""

# This chart supports waiting for traffic to drain from coturn
# before pods are actually terminated. Once in 'drain' mode, no new connections
# are accepted, but old ones are kept alive.
# If you have 2 or more replicas, it's recommended to set this to true,
# and if you only have one coturn replica you may want this to be false, as
# otherwise while the pod restarts, no new calls can be established.
coturnGracefulTermination: false
# Grace period for terminating coturn pods, after which they will be forcibly
# terminated. This setting is only effective when coturnGracefulTermination is
# set to true.
coturnGracePeriodSeconds: 43200 # 12 hours

livenessProbe:
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  timeoutSeconds: 5
  failureThreshold: 5

service:
  # Kubernetes annotations to be set at the Service
  annotations: {}
